name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    # A small pure-Python suite (about 20 s) stays on a GitHub-hosted runner; the
    # ceiling is a generous multiple of that, so a hang cannot hold a runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      # The Makefile tests drive the real recipes against recording stubs, and
      # the end-to-end tests run them against the real mdtablefix, so it is
      # installed here. 0.6.1 is the first release that supports --git selection.
      - name: Install mdtablefix
        uses: >-
          leynos/shared-actions/.github/actions/install-mdtablefix@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          version: '0.6.1'

      - name: Run the tests
        run: make test
